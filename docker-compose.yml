services:
  jornaleiro:
    # imagem publicada pelo workflow `Imagem` (GHCR). Para build local:
    #   docker build -t ghcr.io/brunoanhaia/jornaleiro:latest .
    image: ghcr.io/brunoanhaia/jornaleiro:latest
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    # variaveis vem do ambiente do Compose (`.env` local ou as "environment
    # variables" da stack no Portainer); sem `env_file`, a stack nao quebra se
    # o arquivo nao existir ao lado do compose
    # valores vem do ambiente do Compose (`.env` local ou "environment
    # variables" da stack no Portainer); sem `env_file` a stack nao exige um
    # arquivo `.env` ao lado do compose
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      EXAMINE_TOKEN: ${EXAMINE_TOKEN:-}
    volumes:
      - ./data:/app/data
    # o processo roda como `app` (uid 1000) na imagem, sem capabilities e sem
    # rootfs gravavel: so `./data` (volume) e `/tmp` (tmpfs) sao gravaveis
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "jornaleiro", "serve", "--verificar"]
      interval: ${JORNALEIRO_HEALTHCHECK_INTERVAL:-2m}
      timeout: ${JORNALEIRO_HEALTHCHECK_TIMEOUT:-60s}
      retries: ${JORNALEIRO_HEALTHCHECK_RETRIES:-2}
      start_period: ${JORNALEIRO_HEALTHCHECK_START_PERIOD:-3m}
