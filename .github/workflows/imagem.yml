# Constroi a imagem e publica no GHCR (ghcr.io/<owner>/jornaleiro).
#
# Escopo minimo: `contents: read` no workflow e `packages: write` so no
# job — e o
# `GITHUB_TOKEN` do run, sem PAT. Nao roda em `pull_request`: codigo de PR nao
# recebe token de escrita. O host que roda a coleta so precisa de
# `docker compose pull`.
name: Imagem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: publicar no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar o buildx
        # v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Entrar no GHCR
        # v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        # v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          # o host de producao roda x86_64; multi-arch so dobraria o build
          platforms: linux/amd64
          push: true
          # `build: .` no compose usa a mesma tag: build local e pull do
          # registry se encontram no mesmo nome, sem imagem divergente
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
