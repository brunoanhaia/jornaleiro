# Constroi a imagem e publica no GHCR com a versao derivada dos commits.
#
# Versao por Conventional Commits desde a ultima tag git (`vX.Y.Z`):
# `feat` sobe o minor, `feat!`/`BREAKING CHANGE` sobe o major, o resto sobe
# o patch. A tag git e o registro da versao (o proximo build parte dela) e a
# imagem recebe `X.Y.Z`, `X.Y`, `latest` e `sha-<commit>`.
#
# Permissoes: `contents: read` no workflow; no job, `contents: write` (so
# para empurrar a tag do release) e `packages: write` (GHCR). Sem PAT e sem
# gatilho de `pull_request`: codigo de PR nao recebe token de escrita.
name: Imagem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: publicar no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7
        with:
          # historico e tags completos: a versao sai do log desde a ultima tag
          fetch-depth: 0
          persist-credentials: false

      - name: Calcular a versao (Conventional Commits)
        id: versao
        env:
          QUEBRA: '^[a-z]+(\([^)]*\))?!:|BREAKING[ -]CHANGE'
          FEAT: '^feat(\([^)]*\))?:'
        run: |
          set -euo pipefail
          ultima="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$ultima" ]; then
            base="0.0.0"
            escopo="HEAD"
          else
            base="${ultima#v}"
            escopo="${ultima}..HEAD"
          fi
          mensagens="$(git log --format='%s%n%b' "$escopo")"
          if [ -z "$mensagens" ]; then
            # reexecucao do mesmo commit: republica a versao que ja existe
            tipo="nenhuma"
          elif printf '%s\n' "$mensagens" | grep -Eq "$QUEBRA"; then
            tipo="maior"
          elif printf '%s\n' "$mensagens" | grep -Eq "$FEAT"; then
            tipo="menor"
          else
            tipo="correcao"
          fi
          maior="${base%%.*}"
          resto="${base#*.}"
          menor="${resto%%.*}"
          correcao="${resto#*.}"
          case "$tipo" in
            maior) maior=$((maior + 1)); menor=0; correcao=0 ;;
            menor) menor=$((menor + 1)); correcao=0 ;;
            correcao) correcao=$((correcao + 1)) ;;
          esac
          versao="${maior}.${menor}.${correcao}"
          if git rev-parse -q --verify "refs/tags/v${versao}" >/dev/null; then
            tag_nova="nao"
          else
            tag_nova="sim"
          fi
          {
            echo "versao=${versao}"
            echo "serie=${maior}.${menor}"
            echo "tipo=${tipo}"
            echo "tag_nova=${tag_nova}"
          } >> "$GITHUB_OUTPUT"
          echo "versao ${versao} (${tipo}, tag nova: ${tag_nova})"

      - name: Criar a tag do release
        if: steps.versao.outputs.tag_nova == 'sim'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA: v${{ steps.versao.outputs.versao }}
        run: |
          set -euo pipefail
          git tag -a "$NOVA" -m "release ${NOVA#v}"
          url="https://x-access-token:${GITHUB_TOKEN}"
          git push "${url}@github.com/${GITHUB_REPOSITORY}.git" "$NOVA"

      - name: Preparar o buildx
        # v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Entrar no GHCR
        # v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Montar as tags da imagem
        id: tags
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
          SERIE: ${{ steps.versao.outputs.serie }}
          COMMIT: ${{ github.sha }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY}"
          {
            echo "lista<<TAGS"
            echo "${img}:${VERSAO}"
            echo "${img}:${SERIE}"
            echo "${img}:latest"
            echo "${img}:sha-${COMMIT}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Construir e publicar
        # v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          # o host de producao roda x86_64; multi-arch so dobraria o build
          platforms: linux/amd64
          push: true
          # `build: .` no compose usa a mesma tag: build local e pull do
          # registry se encontram no mesmo nome, sem imagem divergente
          tags: ${{ steps.tags.outputs.lista }}
          build-args: |
            VERSAO=${{ steps.versao.outputs.versao }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
