name: Jornaleiro

on:
  schedule:
    # 07:00 e 19:00 em America/Sao_Paulo (o cron do Actions e UTC e pode atrasar alguns
    # minutos); o 2o run do dia so reenvia se aparecer encarte novo
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reenviar mesmo com encarte identico ao ultimo envio"
        type: boolean
        default: false
      sem_envio:
        description: "So coleta: nao publica nada no Telegram"
        type: boolean
        default: false

# minimo necessario: empurrar o branch `estado` com o GITHUB_TOKEN do proprio run
permissions:
  contents: write

concurrency:
  group: jornaleiro
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets ficam presos a este environment (a restricao de branches pede admin)
    environment: producao
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o pacote e o Chromium
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Conferir os segredos
        # run --no-send nao precisa de token/chat_id (serve para validar sem Telegram)
        if: ${{ inputs.sem_envio != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::configure TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID no environment 'producao'"
            exit 1
          fi

      - name: Restaurar o estado do branch `estado`
        run: |
          mkdir -p data
          if ! git fetch --quiet --depth=1 origin estado; then
            # fetch falhou: so segue sem estado se o branch realmente nao existe;
            # falha transitoria aborta o run para nao reenviar encartes
            CODIGO=0
            git ls-remote --exit-code --heads origin estado >/dev/null 2>&1 || CODIGO=$?
            if [ "$CODIGO" -ne 2 ]; then
              echo "::error::nao consegui restaurar o estado do branch estado (codigo $CODIGO)"
              exit 1
            fi
            echo "branch estado ainda nao existe; seguindo sem estado anterior"
            exit 0
          fi
          if git cat-file -e FETCH_HEAD:state.json 2>/dev/null; then
            git show FETCH_HEAD:state.json > data/state.json
            echo "estado restaurado do branch estado"
          else
            echo "branch estado sem state.json; seguindo sem estado anterior"
          fi

      - name: Coletar e enviar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXAMINE_TOKEN: ${{ secrets.EXAMINE_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          OPCOES=""
          if [ "${{ inputs.forcar }}" = "true" ]; then OPCOES="$OPCOES --forcar"; fi
          if [ "${{ inputs.sem_envio }}" = "true" ]; then OPCOES="$OPCOES --no-send"; fi
          jornaleiro run $OPCOES

      - name: Salvar o estado no branch `estado`
        if: always()
        run: |
          if [ ! -f data/state.json ]; then
            echo "sem state.json para salvar"
            exit 0
          fi
          if git fetch --quiet --depth=1 origin estado; then
            git worktree add --quiet --detach /tmp/estado FETCH_HEAD
          else
            # fetch falhou: so cria o branch se ele realmente nao existe; falha transitoria
            # aborta para nao gravar o estado num branch novo por engano
            CODIGO=0
            git ls-remote --exit-code --heads origin estado >/dev/null 2>&1 || CODIGO=$?
            if [ "$CODIGO" -ne 2 ]; then
              echo "::error::nao consegui buscar o branch estado (codigo $CODIGO)"
              exit 1
            fi
            echo "branch estado ainda nao existe; criando"
            git worktree add --quiet --detach /tmp/estado
            git -C /tmp/estado checkout --quiet --orphan estado
            # o checkout --orphan deixa os arquivos do HEAD no index: o branch guarda so o JSON
            git -C /tmp/estado rm -rf --quiet .
          fi
          cp data/state.json /tmp/estado/state.json
          git -C /tmp/estado add state.json
          if git -C /tmp/estado diff --cached --quiet; then
            echo "estado sem mudancas"
            exit 0
          fi
          git -C /tmp/estado -c user.name="hiroai[bot]" -c user.email="github@bot.oi.dev.br" \
            commit --quiet -m "estado: $(date -u +%F)"
          git -C /tmp/estado push --quiet origin HEAD:estado
