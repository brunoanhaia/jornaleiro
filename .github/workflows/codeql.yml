# A ruleset do branch main exige resultados do CodeQL para mergear PRs; o setup
# avancado (este workflow) e compativel com ela — o default setup exige admin.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # semanal, segunda 00:17 em Brasilia (03:17 UTC)
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7

      - name: Iniciar o CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
