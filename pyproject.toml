[project]
name = "jornaleiro"
version = "0.1.0"
description = "Jornaleiro: coleta os encartes de ofertas dos mercados de Rio Claro/SP e envia por Telegram"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pypdf>=7.0.0",
    "pypdfium2>=5.15.1",
    "img2pdf>=0.6.3",
    "pikepdf>=10.17.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
jornaleiro = "jornaleiro.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
