[project]
name = "jornaleiro"
version = "0.1.0"
description = "Jornaleiro: coleta os encartes de ofertas dos mercados de Rio Claro/SP e envia por Telegram"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "playwright",
    "pypdf",
    "pypdfium2",
    "img2pdf",
    "pikepdf",
    "pillow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jornaleiro = "jornaleiro.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
