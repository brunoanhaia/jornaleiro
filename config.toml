renderer = "auto"        # auto | jina (nao ha navegador: jina = r.jina.ai)
data_dir = "data"

[comprimir]              # comprime os PDFs antes de gravar/enviar (paginas em A4)
enabled = true
modo = "forte"           # forte = rasteriza cada pagina (menor); padrao = reencoda as imagens
dpi = 150                # usado no modo forte; 110 deixa ~15% menor e mais suave
qualidade = 60
largura_max = 1400       # usado no modo padrao
achatar_mascara = true   # compoe a mascara suave no fundo branco (paginas CMYK)

[agenda]                 # agendador interno do container (`jornaleiro serve`)
horarios = ["07:00", "19:00"]   # America/Sao_Paulo; aceita tambem "07:00,19:00" no ambiente
tolerancia_min = 90      # sobe ate 90 min depois do horario ainda recupera a execucao perdida
batida_s = 30            # intervalo maximo entre gravacoes de atualizado_em em data/agenda.json
espera_max_s = 30        # teto de cada sono do loop (segundos)
saude_janela_s = 300     # healthcheck reprova se a batida estiver mais velha (>= 2*batida_s)
falhas_limite = 3        # execucoes seguidas com falha que reprovam o healthcheck

[retencao]               # poda automatica de data/ ao fim de cada run
dias = 15                # dias de coletas mantidos (inclui hoje); 0 desliga a poda

[markets.assai]
enabled = true
eid = 24
nid = 77
offers_page = "https://www.assai.com.br/ofertas/sao-paulo/assai-rio-claro"
json_url = "https://www.assai.com.br/sites/default/files/static/ofertas_assai.json"
max_paginas = 12

[markets.atacadao]
enabled = true
uf = "SP"
city = "Rio Claro"
slug = "rio-claro"
max_bytes = 41943040     # 40 MiB por mercado

[markets.covabra]
enabled = true
page_url = "https://www.covabra.com.br/jornal-de-ofertas"
city = "Rio Claro"

[markets.savegnago]
enabled = true
pdf_url = "https://imagens.savegnagoonline.com.br/jornal-semanal-app/Rio_Claro.pdf"

[markets.examine]
enabled = true
seed_url = "https://www.instagram.com/examinesupermercados/p/Deh37qhjcMZ/"
caption_filter = "Ofertas válidas"
max_posts = 12
site_url = "https://superexaminerc.crescevendas.com/ecommerce"          # Origin do jornal
site_graphql_jornal = "https://www.crescevendas.com/graphql"            # jornal (pamphlets)
